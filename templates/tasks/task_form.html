{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1 class="h2 mb-4">{{ object|yesno:"Update,Create" }} task</h1>
  <form method="post" class="bg-white border rounded p-3" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'tasks:task-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
