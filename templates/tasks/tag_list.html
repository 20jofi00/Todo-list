{% extends "base.html" %}

{% block content %}
  <h1 class="h2">Tags</h1>
  <a href="{% url 'tasks:tag-create' %}" class="btn btn-primary mb-4">Add tag</a>

  {% if tag_list %}
    <div class="table-responsive">
      <table class="table bg-white align-middle">
        <thead>
          <tr>
            <th>Name</th>
            <th>Update</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody>
          {% for tag in tag_list %}
            <tr>
              <td class="text-break">{{ tag.name }}</td>
              <td><a href="{% url 'tasks:tag-update' pk=tag.id %}" class="btn btn-sm btn-secondary">Update</a></td>
              <td><a href="{% url 'tasks:tag-delete' pk=tag.id %}" class="btn btn-sm btn-outline-danger">Delete</a></td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  {% else %}
    <p class="text-secondary">There are no tags yet</p>
  {% endif %}
{% endblock %}
